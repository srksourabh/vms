<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Secure Gate — connecting</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: "Segoe UI", system-ui, sans-serif; background:#16161A; color:#FBFAF8; }
    .card { width:min(420px, 92vw); padding:36px 32px; border-radius:24px;
      background:#1E1D22; border:1px solid rgba(198,161,91,.35); text-align:center; }
    h1 { font-weight:600; font-size:22px; margin:0 0 6px; }
    .sub { color:#C6A15B; letter-spacing:.22em; font-size:11px; text-transform:uppercase; margin-bottom:28px; }
    .light { width:18px; height:18px; border-radius:50%; margin:0 auto 12px; background:#6b7280;
      box-shadow:0 0 0 6px rgba(107,114,128,.18); }
    .light.ok { background:#22c55e; box-shadow:0 0 0 6px rgba(34,197,94,.22); }
    .light.bad { background:#ef4444; box-shadow:0 0 0 6px rgba(239,68,68,.22); }
    .status { font-size:15px; margin:0 0 8px; }
    .hint { font-size:12px; color:#9aa3af; line-height:1.5; }
    button { margin-top:22px; width:100%; border:0; border-radius:12px; padding:12px 16px;
      background:linear-gradient(90deg,#8A6C32,#C6A15B); color:#16161A; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.45; cursor:default; }
  </style>
</head>
<body>
  <div class="card">
    <p class="sub">Quest Mall</p>
    <h1>Secure Gate</h1>
    <div id="light" class="light" aria-hidden="true"></div>
    <p id="status" class="status">Looking for the on-premise system…</p>
    <p id="hint" class="hint">The desktop app talks only to this building's server. Nothing is sent to the cloud.</p>
    <button id="go" disabled>Open Secure Gate</button>
  </div>
  <script>
    const light = document.getElementById('light');
    const status = document.getElementById('status');
    const hint = document.getElementById('hint');
    const go = document.getElementById('go');
    async function tick() {
      const h = await window.secureGate.health();
      if (h.connected) {
        light.className = 'light ok';
        status.textContent = 'Connected to the system';
        hint.textContent = 'Green light: web app and local database are both answering.';
        go.disabled = false;
      } else {
        light.className = 'light bad';
        status.textContent = 'Not connected yet';
        hint.textContent = 'Start the on-prem stack (installer shortcut “Start Secure Gate server”), then this light turns green.';
        go.disabled = true;
      }
    }
    go.onclick = () => window.secureGate.openApp();
    tick();
    setInterval(tick, 2500);
  </script>
</body>
</html>
